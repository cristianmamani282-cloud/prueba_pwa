<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Modo Sin Conexión • Cristian Neil PWA</title>
  <link rel="icon" type="image/png" href="icons/favicon-32.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0d0a17" />
  <link rel="stylesheet" href="style.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body.offline-body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      background: radial-gradient(circle at 50% 20%, #1e1133 0%, #08050e 80%);
      color: #fff;
    }
    .offline-box {
      background: rgba(22, 17, 38, 0.95);
      border: 1px solid #d946ef;
      border-radius: 20px;
      padding: 36px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 0 35px rgba(217, 70, 239, 0.35);
    }
    .offline-icon-svg {
      width: 64px;
      height: 64px;
      fill: none;
      stroke: #f43f5e;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      margin-bottom: 16px;
      filter: drop-shadow(0 0 10px rgba(244, 63, 94, 0.6));
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #ec4899, #f43f5e);
      color: #fff;
      border: none;
      padding: 11px 28px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(244, 63, 94, 0.5);
      transition: transform 0.15s ease;
    }
    .btn-retry:hover {
      transform: scale(1.04);
    }
  </style>
</head>

<body class="offline-body pwa-no-scrollbar">
  <div class="offline-box">
    <svg class="offline-icon-svg" viewBox="0 0 24 24">
      <line x1="1" y1="1" x2="23" y2="23"></line>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
      <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
      <line x1="12" y1="20" x2="12.01" y2="20"></line>
    </svg>
    <h3 style="color: #fff; font-weight: 700; margin-bottom: 10px; font-size: 1.3rem;">Modo Sin Conexión</h3>
    <p style="color: #cbd5e1; font-size: 0.86rem; margin-bottom: 24px; line-height: 1.55;">
      Esta PWA está funcionando sin conexión a internet. Puedes regresar a la aplicación para consultar todos los paneles y recursos ya almacenados en caché.
    </p>
    <button class="btn-retry" onclick="window.location.href='index.html'">
      Volver a la App
    </button>
  </div>
</body>

</html>
