<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sin Conexión - Cristian Neil PWA</title>
  <link rel="icon" type="image/png" href="icons/favicon-32.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#f97316" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .offline-page-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      background: #0b0a10;
    }
    .offline-box {
      background: #1a1726;
      border: 1px solid #f97316;
      border-radius: 14px;
      padding: 30px 20px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 0 30px rgba(249, 115, 22, 0.25);
    }
    .btn-retry {
      background: #f97316;
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 20px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
  </style>
</head>

<body class="pwa-no-scrollbar">
  <div class="offline-page-wrap">
    <div class="offline-box">
      <i class="bi bi-wifi-off" style="font-size: 3rem; color: #f97316;"></i>
      <h3 style="margin-top: 15px; color: #fff;">Modo Sin Conexión</h3>
      <p style="color: #cbd5e1; font-size: 0.85rem; margin-bottom: 20px;">
        Esta PWA está funcionando offline. Puedes volver a la aplicación y consultar tus datos guardados.
      </p>
      <button class="btn-retry" onclick="window.location.href='index.html'">
        <i class="bi bi-arrow-clockwise me-1"></i> Volver a la App
      </button>
    </div>
  </div>
</body>

</html>
